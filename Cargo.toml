[package]
name = "communitysim"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Simulate ecological communities with generalized Lotka-Volterra models, including higher-order interactions"
license = "Apache-2.0"
repository = "https://github.com/yuan-yin-truly/communitysim"
readme = "README.md"
keywords = ["ecology", "lotka-volterra", "simulation", "microbiome", "ode"]
categories = ["science", "simulation"]
include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30.1", optional = true }

[features]
python = ["dep:pyo3"]
